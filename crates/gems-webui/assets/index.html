<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gems</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e6e8ec;
    --muted: #9aa1ac;
    --accent: #5b8cff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { color: var(--muted); font-size: 12px; }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1px;
    background: var(--border);
    height: calc(100vh - 49px);
  }
  section {
    background: var(--bg);
    padding: 16px;
    overflow: auto;
  }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px;
    border-radius: 4px;
    font-family: var(--mono);
    font-size: 13px;
  }
  textarea { resize: vertical; min-height: 60px; }
  button {
    margin-top: 10px;
    background: var(--accent);
    color: white;
    border: none;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 13px;
  }
  button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr.row { cursor: pointer; }
  tr.row:hover { background: var(--panel); }
  .id { font-family: var(--mono); color: var(--muted); font-size: 12px; }
  .error { color: #ff6b6b; margin-top: 10px; }
  pre { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 10px; overflow: auto; font-family: var(--mono); font-size: 12px; }
  .field { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .field .k { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>gems</h1>
  <span class="status" id="status"></span>
</header>
<main>
  <section id="query-panel">
    <label for="store_dir">Store directory</label>
    <input id="store_dir" placeholder="/path/to/store">

    <label for="token">Access token</label>
    <input id="token" placeholder="Bearer token from gems-abac::token::issue" type="password">
    <div class="status">Sent as an Authorization: Bearer header. The subject/roles it verifies to are what ABAC enforces reads against — the server no longer trusts a plain subject id typed here.</div>

    <label for="query">Query</label>
    <textarea id="query">SELECT * FROM entities</textarea>

    <div>
      <button id="run-query">Run query</button>
      <button class="secondary" id="list-types">List entity types</button>
    </div>

    <div class="error" id="query-error"></div>
    <table id="results" hidden>
      <thead><tr><th>Name</th><th>Kind</th><th>Id</th></tr></thead>
      <tbody id="results-body"></tbody>
    </table>
  </section>

  <section id="detail-panel">
    <div class="status" id="detail-placeholder">Select a row to see entity detail.</div>
    <div id="detail" hidden></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

function storeDir() { return $('store_dir').value.trim(); }
function token() { return $('token').value.trim(); }

async function api(path, params) {
  const url = new URL(path, window.location.origin);
  for (const [k, v] of Object.entries(params)) {
    if (v) url.searchParams.set(k, v);
  }
  const headers = {};
  if (token()) headers['Authorization'] = 'Bearer ' + token();
  const res = await fetch(url, { headers });
  return res.json();
}

function renderResults(entities) {
  const body = $('results-body');
  body.innerHTML = '';
  for (const e of entities) {
    const tr = document.createElement('tr');
    tr.className = 'row';
    tr.innerHTML = `<td>${escapeHtml(e.name)}</td><td>${escapeHtml(e.kind)}</td><td class="id">${e.id.slice(0, 12)}…</td>`;
    tr.addEventListener('click', () => loadDetail(e.id));
    body.appendChild(tr);
  }
  $('results').hidden = entities.length === 0;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function runQuery() {
  $('query-error').textContent = '';
  const result = await api('/api/query', { store_dir: storeDir(), q: $('query').value });
  if (!result.ok) {
    $('query-error').textContent = result.error;
    $('results').hidden = true;
    return;
  }
  renderResults(result.data);
}

async function listTypes() {
  $('query-error').textContent = '';
  const result = await api('/api/types', { store_dir: storeDir() });
  if (!result.ok) {
    $('query-error').textContent = result.error;
    $('results').hidden = true;
    return;
  }
  renderResults(result.data);
}

async function loadDetail(id) {
  const result = await api('/api/entity', { store_dir: storeDir(), id });
  const detail = $('detail');
  $('detail-placeholder').hidden = true;
  detail.hidden = false;
  if (!result.ok) {
    detail.innerHTML = `<div class="error">${escapeHtml(result.error)}</div>`;
    return;
  }
  const e = result.data;
  let html = '';
  for (const [k, v] of [['id', e.id], ['name', e.name], ['description', e.description], ['kind', e.kind], ['schema_ref', e.schema_ref]]) {
    html += `<div class="field"><span class="k">${k}</span><span>${escapeHtml(v || '')}</span></div>`;
  }
  if (e.fields) {
    html += '<h3>Fields</h3><pre>' + escapeHtml(JSON.stringify(e.fields, null, 2)) + '</pre>';
  }
  detail.innerHTML = html;
}

$('run-query').addEventListener('click', runQuery);
$('list-types').addEventListener('click', listTypes);
$('status').textContent = 'connected to ' + window.location.host;
</script>
</body>
</html>
